name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files require gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build platform command
        run: go build -o bin/platform ./cmd/platform

      - name: Build local Discord interaction command
        run: go build -o bin/discord-local ./cmd/discord-local

      - name: Build Discord Lambda command
        run: go build -o bin/discord-lambda ./cmd/discord-lambda

      - name: Package Discord Lambda
        shell: bash
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build \
              -trimpath \
              -tags lambda.norpc \
              -ldflags="-s -w" \
              -o dist/bootstrap \
              ./cmd/discord-lambda
          (cd dist && zip -q discord-interactions.zip bootstrap)
          rm dist/bootstrap

      - name: Upload Discord Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: discord-interactions-lambda
          path: dist/discord-interactions.zip
          if-no-files-found: error
          retention-days: 7

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Show Terraform version
        run: terraform version

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize bootstrap configuration
        run: terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false

      - name: Validate bootstrap configuration
        run: terraform -chdir=infra/terraform/bootstrap validate

      - name: Initialize development configuration
        run: terraform -chdir=infra/terraform/environments/dev init -backend=false -input=false

      - name: Validate development configuration
        run: terraform -chdir=infra/terraform/environments/dev validate
